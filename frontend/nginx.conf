# =============================================================================
# frontend/nginx.conf
# =============================================================================
# This file does TWO jobs, and the second one is the architecturally important
# one:
#
#   1. Serve the built React SPA (static files).
#   2. REVERSE-PROXY /api/* to the backend Service, over cluster-internal DNS.
#
# Job 2 is why backend-service can be a ClusterIP with no Ingress rule:
#
#     Browser ---> ALB ---> frontend pod (nginx)
#                                 |
#                                 |  /api/*  proxied server-side
#                                 v
#                          backend-service:8000   <- ClusterIP, internal only
#                                 |
#                                 v
#                          backend pods
#
# The browser only ever talks to nginx. It never learns the backend's address,
# and there is no route from the internet to backend-service at all.
#
# The alternative — an Ingress path rule "/api -> backend-service" — is simpler
# to write but PUBLISHES the API on the ALB, because the browser would then
# call it directly. That would contradict "the backend is internal only".
# =============================================================================

server {
    # -------------------------------------------------------------------------
    # PORT 8080, NOT 80.
    # -------------------------------------------------------------------------
    # This image is nginx-unprivileged, which runs as UID 101 rather than root.
    # Ports below 1024 are privileged on Linux and a non-root process cannot
    # bind them.
    #
    # Nothing is lost: the Kubernetes Service maps port 80 -> targetPort 8080,
    # so callers still use :80. We simply do not run a web server as root.
    # -------------------------------------------------------------------------
    listen       8080;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    # -------------------------------------------------------------------------
    # Real client IP
    # -------------------------------------------------------------------------
    # The ALB terminates the client connection, so without this every log line
    # would record the ALB's private IP. X-Forwarded-For carries the original
    # client address; the VPC CIDR is declared trusted so a client cannot forge
    # it by sending its own header.
    # -------------------------------------------------------------------------
    set_real_ip_from 10.0.0.0/16;
    real_ip_header   X-Forwarded-For;
    real_ip_recursive on;

    # -------------------------------------------------------------------------
    # SECURITY HEADERS
    # -------------------------------------------------------------------------
    # Defined in security-headers.conf and INCLUDED INTO EVERY LOCATION BLOCK
    # below, not set once here.
    #
    # The reason is nginx's add_header inheritance rule: a location block that
    # sets ANY add_header of its own DISCARDS every header inherited from the
    # server block. All three of our locations set Cache-Control, so setting
    # the security headers here alone would silently drop all of them.
    #
    # Full explanation in security-headers.conf. Verify with:
    #     curl -sI http://localhost:8080/ | grep -i x-frame
    # -------------------------------------------------------------------------

    # -------------------------------------------------------------------------
    # COMPRESSION
    # -------------------------------------------------------------------------
    # Typically cuts the JS bundle by 70%+. Directly reduces ALB data-processing
    # charges and page load time.
    #
    # Note images are NOT in this list — JPEG and PNG are already compressed,
    # and gzipping them burns CPU to make the file marginally larger.
    # -------------------------------------------------------------------------
    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_comp_level   6;
    gzip_types        text/plain text/css text/xml application/json
                      application/javascript application/xml+rss
                      application/atom+xml image/svg+xml;

    # =========================================================================
    # HEALTH CHECK
    # =========================================================================
    # Used by the Kubernetes liveness/readiness probes AND by the ALB target
    # group health check.
    #
    # It deliberately does NOT touch the backend. A frontend pod serving static
    # files is healthy whether or not the API is up — if it reported unhealthy
    # during a backend outage, the ALB would pull every frontend target and
    # turn a degraded API into a completely dead website.
    #
    # access_log off so health checks (every 15s, from several ALB nodes) do
    # not drown the real request logs.
    # =========================================================================
    location = /healthz {
        access_log off;
        include /etc/nginx/security-headers.conf;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # =========================================================================
    # API PROXY — the important part
    # =========================================================================
    location /api/ {
        # ---------------------------------------------------------------------
        # THE UPSTREAM NAME
        # ---------------------------------------------------------------------
        # "backend-service" is a Kubernetes Service name. CoreDNS resolves it
        # because the pod's /etc/resolv.conf contains a search path of
        #     <namespace>.svc.cluster.local svc.cluster.local cluster.local
        # so the short name expands to
        #     backend-service.jollof-run.svc.cluster.local
        #
        # It resolves to the Service's stable ClusterIP — NOT to a pod IP.
        # kube-proxy's iptables/IPVS rules then load-balance that ClusterIP
        # across the healthy backend pods. Pods can die and be replaced with
        # new IPs and this configuration never changes. That is the entire
        # point of a Service.
        #
        # The same name works in docker-compose because the compose service is
        # also called backend-service — one config file, both environments.
        #
        # CAVEAT WORTH KNOWING: nginx resolves this name ONCE at startup and
        # caches it. That is safe here because a ClusterIP is stable for the
        # life of the Service. If you DELETE and recreate backend-service it
        # gets a new ClusterIP, and these nginx pods keep using the old one
        # until they restart (`kubectl rollout restart deploy/frontend`).
        # ---------------------------------------------------------------------

        # The trailing slash on BOTH sides strips the /api prefix:
        #   /api/restaurants  ->  http://backend-service:8000/restaurants
        # Remove either slash and you get /api/restaurants forwarded verbatim,
        # which the backend does not serve — a 404 that looks like a routing
        # bug for about twenty minutes.
        proxy_pass http://backend-service:8000/;

        proxy_http_version 1.1;

        # Preserve the original request details for the backend's logs.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts. Without these, a hung backend ties up nginx workers until
        # the default 60s elapses and the frontend appears to hang too.
        proxy_connect_timeout 5s;
        proxy_send_timeout    30s;
        proxy_read_timeout    30s;

        # Re-include, because the add_header below would otherwise discard
        # every security header inherited from the server block.
        include /etc/nginx/security-headers.conf;

        # API responses must never be cached by browsers or intermediaries.
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }

    # =========================================================================
    # STATIC ASSETS — hashed filenames, cached forever
    # =========================================================================
    # Vite emits filenames like index-4f3a9b2c.js. The hash changes whenever the
    # content changes, so a new deploy produces a new filename and the browser
    # fetches it. That makes a one-year immutable cache completely safe.
    #
    # `immutable` tells the browser not even to send a revalidation request.
    # =========================================================================
    location ~* \.(js|css|woff2?|ttf|eot|svg|png|jpe?g|gif|webp|avif|ico)$ {
        # NOTE: do NOT also use `expires 1y;` here.
        #
        # The `expires` directive emits its OWN Cache-Control header, so
        # combining it with an add_header Cache-Control sends the header TWICE:
        #     Cache-Control: max-age=31536000
        #     Cache-Control: public, immutable
        # Browsers merge them, but it is sloppy and makes the effective policy
        # hard to read. One directive, one header.
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
        try_files $uri =404;
    }

    # =========================================================================
    # SPA FALLBACK
    # =========================================================================
    # A single-page app owns its own routing. If someone deep-links to
    # /restaurants/3, there is no such FILE on disk — nginx must serve
    # index.html and let React figure it out.
    #
    #   try_files $uri $uri/ /index.html;
    #             |     |     |
    #             |     |     +- otherwise, hand back the SPA shell
    #             |     +------- then try it as a directory
    #             +------------- first try the literal path
    #
    # Without this line, every URL except "/" returns 404 after a page refresh.
    # It is the most common SPA deployment bug there is.
    # =========================================================================
    location / {
        try_files $uri $uri/ /index.html;

        include /etc/nginx/security-headers.conf;

        # index.html itself must NEVER be cached. It is the file that points at
        # the hashed bundles; a cached copy would keep serving the previous
        # deploy's JavaScript indefinitely.
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    # Do not serve dotfiles (.git, .env, .htaccess) if one ever ends up in the
    # image by accident.
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
