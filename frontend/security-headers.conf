# =============================================================================
# security-headers.conf — included into EVERY location block
# =============================================================================
#
# WHY THIS IS A SEPARATE FILE, AND NOT JUST SET ONCE IN THE SERVER BLOCK:
#
# nginx's add_header directives are inherited from a parent block ONLY IF the
# child block defines NO add_header of its own. As soon as a location block
# adds a single header, it REPLACES the entire inherited set rather than
# appending to it.
#
# So this, which looks obviously correct, is broken:
#
#     server {
#         add_header X-Frame-Options "SAMEORIGIN" always;
#         add_header Content-Security-Policy "..."   always;
#
#         location / {
#             add_header Cache-Control "no-cache" always;   # <-- kills BOTH
#         }                                                 #     headers above
#     }
#
# The `always` flag does NOT change this. `always` controls whether a header is
# sent on error responses (4xx/5xx); it has nothing to do with inheritance.
#
# We caught this by actually checking the response rather than assuming:
#
#     curl -sI http://localhost:8080/ | grep -i x-frame
#     (nothing)
#
# The fix is to define the headers once here and `include` this file in every
# location block that sets any header of its own.
#
# This is one of the most common nginx misconfigurations there is, and it is
# invisible unless you inspect real responses.
# =============================================================================

# Stop the browser MIME-sniffing a response into something executable.
add_header X-Content-Type-Options "nosniff" always;

# Refuse to be embedded in a frame — blocks clickjacking.
add_header X-Frame-Options "SAMEORIGIN" always;

# Do not leak full URLs to third-party origins in the Referer header.
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# Deny access to device APIs we never use.
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

# Content-Security-Policy: an allowlist of what the page may load.
#
#   default-src 'self'        nothing loads from anywhere by default
#   img-src ... unsplash      our food photography CDN
#   style-src 'unsafe-inline' REQUIRED: Tailwind's runtime and Framer Motion
#                             both set inline styles. This IS the weak spot in
#                             this header — removing it needs nonce-based CSP
#                             wired into the build. Worth doing in production;
#                             worth KNOWING about either way.
#   script-src 'self'         no inline scripts, no CDN scripts
#   frame-ancestors 'self'    the modern replacement for X-Frame-Options
add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https://images.unsplash.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; script-src 'self'; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;
