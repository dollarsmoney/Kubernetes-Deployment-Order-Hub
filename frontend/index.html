<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Jollof Run — Your jollof, running to you</title>
    <meta
      name="description"
      content="Order jollof, egusi, suya and small chops from the best kitchens in Lagos, Abuja and Port Harcourt. Delivered hot, in under 30 minutes."
    />
    <meta name="theme-color" content="#e11d48" />

    <!-- Open Graph — what shows up when the link is pasted into WhatsApp -->
    <meta property="og:title" content="Jollof Run — Your jollof, running to you" />
    <meta
      property="og:description"
      content="Nigeria's fastest food delivery. Order from 2,400+ kitchens."
    />
    <meta property="og:type" content="website" />

    <!-- Inline SVG favicon: the rice-grain arrow mark. No extra request. -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23e11d48'/%3E%3Cpath d='M8 20.5c3.2-1 5.4-2.4 7.4-4.4 2-2 3.4-4.2 4.4-7.4l4.2 4.2c-1 3.2-2.4 5.4-4.4 7.4-2 2-4.2 3.4-7.4 4.4z' fill='white'/%3E%3Ccircle cx='21.5' cy='10.5' r='2' fill='%23fbbf24'/%3E%3C/svg%3E"
    />

    <!--
      Google Fonts. preconnect opens the TCP + TLS handshake to the font host
      early, in parallel with parsing the rest of the head, which typically
      saves 100-300ms on first paint.

      display=swap means text renders immediately in the fallback font and
      swaps when the webfont arrives, instead of showing nothing for up to 3
      seconds (the "flash of invisible text").
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />

    <!-- Warm the connection to the image CDN before React asks for photos -->
    <link rel="preconnect" href="https://images.unsplash.com" />
  </head>

  <body class="bg-white">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
