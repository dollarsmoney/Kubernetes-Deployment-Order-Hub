# =============================================================================
# serviceaccount.yaml — the pod's identity, in Kubernetes AND in AWS
# =============================================================================
#
# THE COMPLETE IRSA CHAIN. Every arrow here is a real mechanism, not a metaphor:
#
#   1.  Backend Pod
#          spec.serviceAccountName: backend-sa
#              |
#   2.  kubelet mounts a PROJECTED SERVICE ACCOUNT TOKEN into the pod at
#          /var/run/secrets/eks.amazonaws.com/serviceaccount/token
#       It is a signed JWT. "Projected" means kubelet rotates it automatically
#       (hourly) rather than it being a static Secret that lives forever.
#              |
#   3.  The token's claims include:
#          iss = https://oidc.eks.us-east-1.amazonaws.com/id/XXXXXXXX
#          sub = system:serviceaccount:jollof-run:backend-sa
#          aud = sts.amazonaws.com
#              |
#   4.  The AWS SDK / CSI driver sees the annotation below and calls
#          sts:AssumeRoleWithWebIdentity
#       presenting that token.
#              |
#   5.  STS verifies the JWT SIGNATURE against the cluster's OIDC provider —
#       registered in IAM by aws_iam_openid_connect_provider (terraform/eks.tf).
#              |
#   6.  STS evaluates the role's TRUST POLICY (terraform/iam.tf):
#          "<oidc-host>:sub" == "system:serviceaccount:jollof-run:backend-sa"
#          "<oidc-host>:aud" == "sts.amazonaws.com"
#              |
#   7.  Both match -> STS returns TEMPORARY credentials for
#          jollof-run-backend-irsa, valid about one hour, auto-refreshed.
#              |
#   8.  That role's policy permits EXACTLY:
#          secretsmanager:GetSecretValue  on ONE secret ARN
#          kms:Decrypt                    on ONE key ARN
#
# WHY THIS IS BETTER THAN THE ALTERNATIVES:
#
#   Access keys in a Secret   long-lived, rotated by hand, leak in `kubectl
#                             get secret -o yaml`, and often end up in Git.
#   Permissions on the node   inherited by EVERY pod on that node. A compromised
#     role                    frontend container could read the database
#                             credentials.
#   IRSA                      per-pod, short-lived, no stored credential
#                             anywhere, and scoped by namespace + SA name.
#
# THE FAILURE MODE TO RECOGNISE: if the annotation below is missing or has a
# typo, there is no error at deploy time. The pod starts fine and fails later
# with "AccessDenied ... not authorized to perform sts:AssumeRoleWithWebIdentity"
# or, worse, silently falls back to the NODE role and gets a confusing
# permissions error against a completely different identity.
# =============================================================================

apiVersion: v1
kind: ServiceAccount
metadata:
  name: backend-sa
  namespace: jollof-run
  labels:
    app: backend
    app.kubernetes.io/part-of: jollof-run
  annotations:
    # -------------------------------------------------------------------------
    # THE ONE LINE THAT MAKES IRSA WORK.
    #
    # A mutating admission webhook in the EKS control plane watches for this
    # annotation. When it sees it, it injects into every pod using this SA:
    #     env AWS_ROLE_ARN
    #     env AWS_WEB_IDENTITY_TOKEN_FILE
    #     a projected serviceAccountToken volume
    #
    # You never write those yourself. That is why the Deployment has no AWS
    # configuration in it at all.
    #
    # This ARN is deterministic — the role NAME is set in terraform/iam.tf —
    # so it is safe to commit. Confirm it with:
    #     terraform output -raw backend_irsa_role_arn
    # -------------------------------------------------------------------------
    eks.amazonaws.com/role-arn: arn:aws:iam::609898225411:role/jollof-run-backend-irsa

    # Token lifetime in seconds. 3600 (1 hour) is the default and is right:
    # short enough that a leaked token expires quickly, long enough that
    # refreshes are not constant.
    eks.amazonaws.com/token-expiration: '3600'

# -----------------------------------------------------------------------------
# NOTE: the FRONTEND has no ServiceAccount of its own and needs none.
#
# It calls no AWS API — it serves static files and proxies to backend-service.
# It therefore runs as the namespace's `default` ServiceAccount with no AWS
# identity whatsoever.
#
# That asymmetry IS the least-privilege principle in practice: the component
# that needs AWS access gets exactly the AWS access it needs, and the component
# that does not need any gets none.
# -----------------------------------------------------------------------------
