# =============================================================================
# secretproviderclass.yaml — tells the CSI driver WHICH secret to mount
# =============================================================================
#
# THREE PIECES have to be installed for this to work. Missing any one produces
# a pod stuck in ContainerCreating with a mount error:
#
#   1. The Secrets Store CSI Driver  (upstream, generic)
#        helm install csi-secrets-store \
#          secrets-store-csi-driver/secrets-store-csi-driver \
#          --namespace kube-system --set syncSecret.enabled=true
#
#   2. The AWS PROVIDER for it      (AWS-specific, talks to Secrets Manager)
#        kubectl apply -f https://raw.githubusercontent.com/aws/\
#          secrets-store-csi-driver-provider-aws/main/deployment/\
#          aws-provider-installer.yaml
#
#   3. THIS SecretProviderClass     (says which secret, and where to put it)
#
# The driver is the plumbing; the provider is the AWS adapter; this object is
# the instruction. People routinely install 1 and 3 and wonder why nothing
# mounts.
#
# HOW THE MOUNT ACTUALLY HAPPENS:
#
#   Pod scheduled
#     -> kubelet sees a volume of type secrets-store.csi.k8s.io
#     -> calls the CSI driver's NodePublishVolume
#     -> driver reads THIS object by the name in the volume attributes
#     -> hands the objects[] list to the AWS provider
#     -> provider authenticates AS THE POD via IRSA (serviceaccount.yaml)
#     -> provider calls secretsmanager:GetSecretValue
#     -> plaintext written into a TMPFS mount inside the pod
#
# TMPFS matters: the secret lives in memory, never on the node's disk, and
# disappears the moment the pod does.
# =============================================================================

apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: jollof-db-credentials
  namespace: jollof-run # must be the SAME namespace as the pods that use it
spec:
  provider: aws

  parameters:
    # -------------------------------------------------------------------------
    # `objects` is a YAML STRING containing YAML. That is genuinely how this
    # API is defined — note the `|` block scalar. The provider parses the
    # string itself.
    #
    # A wrong indentation here fails with "failed to parse objects", which is
    # about as much help as you get.
    # -------------------------------------------------------------------------
    objects: |
      - objectName: "jollof-run/db-credentials"
        objectType: "secretsmanager"
        objectAlias: "db-credentials"

    # objectName   the secret's NAME (or full ARN) in Secrets Manager.
    #              Must match aws_secretsmanager_secret.db.name exactly:
    #                terraform output -raw secret_name
    #
    # objectType   "secretsmanager" or "ssmparameter".
    #
    # objectAlias  the FILENAME inside the mount. Without it the file would be
    #              named after objectName, and "jollof-run/db-credentials"
    #              contains a slash — which would create a subdirectory.
    #              With the alias, backend/db.py reads exactly:
    #                  /mnt/secrets-store/db-credentials
    #
    # WHAT WE ARE NOT DOING — and why:
    #
    #   jmesPath:
    #     - path: "username"
    #       objectAlias: "db-username"
    #     - path: "password"
    #       objectAlias: "db-password"
    #
    # jmesPath splits the JSON into one file per field. Convenient if you want
    # each value as its own env var — but then db.py would have to read five
    # files and reassemble them, and a missing field would be a silent None
    # rather than an error. We mount the whole JSON document and parse it once,
    # which is both simpler and safer.

# -----------------------------------------------------------------------------
# OPTIONAL: sync the mounted secret into a native Kubernetes Secret.
# -----------------------------------------------------------------------------
# Uncomment `secretObjects` below to have the driver ALSO create a Kubernetes
# Secret named jollof-db-secret, which you could then consume with envFrom.
#
# WEIGH THIS UP HONESTLY. Syncing means the value is written to ETCD, where it
# is readable by anyone with `kubectl get secret -o yaml` in this namespace and
# is only encrypted at rest if you enabled EKS envelope encryption. The mounted
# file never leaves the pod's tmpfs.
#
# We keep it OFF and read the file. Turn it on only when something genuinely
# needs an environment variable and cannot read a file.
#
#   secretObjects:
#     - secretName: jollof-db-secret
#       type: Opaque
#       data:
#         - objectName: db-credentials   # the objectAlias above
#           key: credentials.json
# -----------------------------------------------------------------------------
