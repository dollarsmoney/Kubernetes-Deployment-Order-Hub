# =============================================================================
# ci-cd.yml — static analysis → tests → Trivy → ECR + GHCR → EKS → Slack
# =============================================================================
#
#   pull_request                push to main
#        |                           |
#        +---------------------------+
#        v                           v
#   [lint] [test-backend] [test-frontend] [scan-source]
#        \_______________ | _______________/
#                         v
#                   [build-scan]        docker build, Trivy image scan
#                         v
#                      [push]           main only — OIDC -> ECR, token -> GHCR
#                         v
#                     [deploy]          main only — OIDC -> EKS
#                         v
#                     [notify]          Slack: any failure, + every main deploy
#
# ONE workflow, not two. If CI and CD were separate workflows both triggered by
# `push: main`, they would run in PARALLEL and CD could publish an image whose
# tests had already failed. `needs:` makes the ordering an enforced property.
#
# -----------------------------------------------------------------------------
# SECURITY MODEL — this repository is PUBLIC
# -----------------------------------------------------------------------------
# Anyone can fork a public repo and open a pull request. Two independent guards
# stop a fork PR from reaching AWS:
#
#   1. `permissions` are declared PER JOB, not workflow-wide. Only `push` and
#      `deploy` request `id-token: write`. Everything else runs with a
#      read-only token and no ability to request an OIDC assertion at all.
#
#   2. Those two jobs are gated on
#      `github.event_name == 'push' && github.ref == 'refs/heads/main'`,
#      which a pull_request event can never satisfy.
#
#   And behind both, the IAM trust policy pins the `sub` claim to
#   `repo:<owner>/<repo>:ref:refs/heads/main` — so even a leaked token from
#   another branch is refused by STS. See terraform/github-oidc.tf.
#
# There is NO aws-access-key secret in this repository, and GHCR uses the
# per-run GITHUB_TOKEN rather than a PAT. The single stored secret is
# SLACK_WEBHOOK_URL, which can post a message to one channel and nothing more.
# =============================================================================

name: CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  # Lets you re-run the pipeline by hand without an empty commit.
  workflow_dispatch:

# Workflow-level default: read-only. Jobs opt IN to more, never out.
permissions:
  contents: read

# Supersede in-flight runs on the same ref. Pushing three commits in a row
# should not leave two doomed deploys racing the third.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  AWS_REGION: us-east-1
  CLUSTER_NAME: jollof-run
  NAMESPACE: jollof-run
  ECR_REGISTRY: 609898225411.dkr.ecr.us-east-1.amazonaws.com
  # GHCR paths must be lowercase, and this repository's name is mixed-case, so
  # it is written out rather than derived from ${{ github.repository }}.
  GHCR_IMAGE_BASE: ghcr.io/dollarsmoney/kubernetes-deployment-order-hub
  # An ARN is an identifier, not a credential. Committing it is fine — the
  # trust policy is what decides who may assume it.
  AWS_ROLE: arn:aws:iam::609898225411:role/jollof-run-github-actions

jobs:
  # ===========================================================================
  # 1. STATIC ANALYSIS
  # ===========================================================================
  lint:
    name: Static analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # ---------------------------------------------------------------- Python
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install ruff
        run: pip install --no-cache-dir ruff==0.8.6

      - name: ruff check (lint)
        run: ruff check backend

      - name: ruff format --check
        # --check reports formatting drift without rewriting files. A CI job
        # that silently reformats your code is a CI job you stop trusting.
        run: ruff format --check backend

      # ------------------------------------------------------------ JavaScript
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      - name: ESLint
        working-directory: frontend
        run: npm run lint

      # -------------------------------------------------------------- Terraform
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
          terraform_wrapper: false

      - name: terraform fmt
        run: terraform -chdir=terraform fmt -check -recursive -diff

      - name: terraform validate
        # -backend=false: validation needs the provider schemas, not remote
        # state. State for this project is local (see provider.tf), so a runner
        # has nothing to initialise against — and validate does not need it.
        run: |
          terraform -chdir=terraform init -backend=false -input=false
          terraform -chdir=terraform validate

      # ------------------------------------------------------------ Dockerfiles
      - name: hadolint (frontend)
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: frontend/Dockerfile
          # DL3018 = "pin apk versions". We install nothing via apk; the base
          # images are already digest-stable via explicit tags.
          ignore: DL3018

      - name: hadolint (backend)
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: backend/Dockerfile
          ignore: DL3018

      # ----------------------------------------------------------------- Shell
      - name: shellcheck
        run: sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck && shellcheck scripts/*.sh

      # --------------------------------------------------------- K8s manifests
      - name: kubeconform
        run: |
          curl -sSfL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz \
            | tar -xz -C /tmp kubeconform
          # -ignore-missing-schemas: SecretProviderClass is a CRD installed by
          # the Secrets Store CSI Driver, so no schema exists in the upstream
          # catalogue. Everything with a built-in schema is still validated.
          /tmp/kubeconform -strict -summary -ignore-missing-schemas kubernetes/

  # ===========================================================================
  # 2. BACKEND TESTS — against a real PostgreSQL
  # ===========================================================================
  test-backend:
    name: Backend tests
    runs-on: ubuntu-latest

    # A REAL Postgres, not SQLite.
    #
    # backend/db.py uses ILIKE and CAST(:x AS TEXT), both PostgreSQL-specific.
    # Testing them against SQLite would pass while proving nothing, and would
    # quietly drift from what actually runs against RDS. A service container
    # costs ~5 seconds and tests the real thing — including seed.sql.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: jollofadmin
          POSTGRES_PASSWORD: testonly
          POSTGRES_DB: jollofrun_test
        ports: ['5432:5432']
        # Without a health check the test step races the database's startup and
        # fails intermittently — the worst kind of CI failure.
        options: >-
          --health-cmd "pg_isready -U jollofadmin -d jollofrun_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          pip install --no-cache-dir -r backend/requirements.txt
          pip install --no-cache-dir -r backend/requirements-dev.txt

      - name: pytest
        working-directory: backend
        env:
          DATABASE_URL: postgresql+psycopg2://jollofadmin:testonly@localhost:5432/jollofrun_test
        run: pytest -q --cov=. --cov-report=term-missing

  # ===========================================================================
  # 3. FRONTEND TESTS
  # ===========================================================================
  test-frontend:
    name: Frontend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      - name: vitest
        working-directory: frontend
        run: npm run test -- --run

      - name: Production build
        # A passing test suite over code that does not build is not a green
        # pipeline. This catches import cycles and Vite config breakage.
        working-directory: frontend
        run: npm run build

  # ===========================================================================
  # 4. TRIVY — source, dependencies and IaC
  # ===========================================================================
  scan-source:
    name: Trivy (source + IaC)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # required to upload SARIF
    steps:
      - uses: actions/checkout@v7

      # --- Gate: CRITICAL only ------------------------------------------------
      # Dependencies and hardcoded secrets. exit-code 1 breaks the build.
      #
      # WHY NOT ALSO FAIL ON HIGH: base images routinely ship unfixable HIGH
      # CVEs. A pipeline that is permanently red teaches you to ignore it, which
      # is strictly worse than one that is red only when it matters. HIGH still
      # gets reported below.
      - name: Trivy filesystem (gate on CRITICAL)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'

      # --- IaC misconfiguration ----------------------------------------------
      # Covers Terraform and the Kubernetes manifests. Replaces a separate
      # tfsec/checkov step — Trivy absorbed tfsec upstream.
      - name: Trivy config (Terraform + Kubernetes)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: config
          scan-ref: .
          severity: CRITICAL
          exit-code: '1'

      # --- Report: everything HIGH and above ---------------------------------
      - name: Trivy filesystem (SARIF)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          format: sarif
          output: trivy-fs.sarif
          exit-code: '0' # report, never block

      - name: Upload to the Security tab
        uses: github/codeql-action/upload-sarif@v4
        # Upload findings even when an earlier gate failed — you want to SEE
        # what broke the build, not just that something did.
        if: always()
        with:
          sarif_file: trivy-fs.sarif
          category: trivy-filesystem

  # ===========================================================================
  # 5. BUILD + SCAN IMAGES  (runs on PRs too — no AWS, no push)
  # ===========================================================================
  build-scan:
    name: Build & scan images
    runs-on: ubuntu-latest
    needs: [lint, test-backend, test-frontend, scan-source]
    permissions:
      contents: read
      security-events: write
    strategy:
      # One job per image, so a frontend CVE does not mask a backend one.
      fail-fast: false
      matrix:
        include:
          - name: frontend
            context: ./frontend
          - name: backend
            context: ./backend
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v3

      - name: Build (load locally, do not push)
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          # linux/amd64 explicitly: EKS nodes are x86. Building arm64 by
          # accident produces an image that runs fine on a Mac and dies on the
          # cluster with "exec format error".
          platforms: linux/amd64
          push: false
          load: true
          tags: ${{ matrix.name }}:${{ github.sha }}
          # GitHub Actions layer cache. The `push` job rebuilds from this cache
          # in seconds rather than repeating the whole build.
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

      - name: Trivy image (gate on CRITICAL)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ matrix.name }}:${{ github.sha }}
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'

      - name: Trivy image (SARIF)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ matrix.name }}:${{ github.sha }}
          severity: HIGH,CRITICAL
          format: sarif
          output: trivy-${{ matrix.name }}.sarif
          exit-code: '0'

      - name: Upload to the Security tab
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: trivy-${{ matrix.name }}.sarif
          # Distinct category per image, otherwise the second upload overwrites
          # the first and you only ever see one image's findings.
          category: trivy-image-${{ matrix.name }}

  # ===========================================================================
  # 6. PUSH TO ECR + GHCR  — main only, first job that touches AWS
  # ===========================================================================
  push:
    name: Push to ECR + GHCR
    runs-on: ubuntu-latest
    needs: [build-scan]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      id-token: write # THE OIDC PERMISSION. Only this job and `deploy` get it.
      packages: write # GHCR, via the built-in GITHUB_TOKEN. No job above has it.
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: frontend
            context: ./frontend
          - name: backend
            context: ./backend
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v3

      # No secrets. The action requests a JWT from GitHub, hands it to STS, and
      # receives ~1h credentials. Verify in the logs: it prints the assumed role.
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: gha-push-${{ github.run_id }}

      - name: Who am I?
        # Cheap, and it is the proof the OIDC exchange worked. Should report an
        # assumed-role ARN, never a user.
        run: aws sts get-caller-identity

      - name: Log in to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Log in to GHCR
        # No new secret to manage: GITHUB_TOKEN is minted for this run and dies
        # with it. `packages: write` above is what makes it able to publish.
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64
          push: true
          # FOUR tags across TWO registries, and the SHA is the one that matters.
          #
          # :latest is a moving target — you cannot tell which build is running,
          # and `kubectl rollout undo` has nothing meaningful to roll back to.
          # The deploy job below pins the SHA, which finally makes the
          # deployments immutable. :latest is kept only for convenience when
          # pulling by hand.
          #
          # ECR is what EKS pulls from. GHCR is a public mirror so the images are
          # visible from the repository itself. One build feeds both, so the two
          # registries hold the IDENTICAL DIGEST — there is no second build that
          # could drift from the artifact Trivy actually scanned.
          tags: |
            ${{ env.ECR_REGISTRY }}/jollof-run/${{ matrix.name }}:${{ github.sha }}
            ${{ env.ECR_REGISTRY }}/jollof-run/${{ matrix.name }}:latest
            ${{ env.GHCR_IMAGE_BASE }}/${{ matrix.name }}:${{ github.sha }}
            ${{ env.GHCR_IMAGE_BASE }}/${{ matrix.name }}:latest
          cache-from: type=gha,scope=${{ matrix.name }}

  # ===========================================================================
  # 7. DEPLOY TO EKS — main only
  # ===========================================================================
  deploy:
    name: Deploy to EKS
    runs-on: ubuntu-latest
    needs: [push]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: gha-deploy-${{ github.run_id }}

      - name: Configure kubectl
        # This needs eks:DescribeCluster (IAM) to fetch the endpoint and CA.
        # It grants nothing INSIDE Kubernetes — that comes from the EKS access
        # entry, scoped to the jollof-run namespace. Two separate systems.
        run: aws eks update-kubeconfig --region "$AWS_REGION" --name "$CLUSTER_NAME"

      - name: Confirm least-privilege scoping
        # Documents the boundary and fails loudly if someone widens the access
        # policy later. CI must NOT be able to touch kube-system.
        run: |
          echo "Can I edit deployments in $NAMESPACE?"
          kubectl auth can-i patch deployments -n "$NAMESPACE"
          echo "Can I delete pods in kube-system? (expected: no)"
          if kubectl auth can-i delete pods -n kube-system --quiet; then
            echo "::error::CI role has kube-system access — the EKS access policy is too broad."
            exit 1
          fi
          echo "Correctly denied."

      - name: Roll out the new images
        run: |
          kubectl -n "$NAMESPACE" set image deployment/frontend \
            frontend="$ECR_REGISTRY/jollof-run/frontend:$GITHUB_SHA"
          kubectl -n "$NAMESPACE" set image deployment/backend \
            backend="$ECR_REGISTRY/jollof-run/backend:$GITHUB_SHA"

      - name: Wait for the rollout
        # The step that makes this a real deploy rather than a fire-and-forget.
        # `rollout status` blocks until every replica is Ready and returns
        # non-zero on failure, so a broken image is a RED BUILD instead of a
        # silent CrashLoopBackOff nobody notices until a user complains.
        run: |
          kubectl -n "$NAMESPACE" rollout status deployment/frontend --timeout=5m
          kubectl -n "$NAMESPACE" rollout status deployment/backend  --timeout=5m

      - name: Roll back on failure
        if: failure()
        run: |
          echo "::warning::Rollout failed — reverting both deployments."
          kubectl -n "$NAMESPACE" rollout undo deployment/frontend || true
          kubectl -n "$NAMESPACE" rollout undo deployment/backend  || true

      - name: Summary
        if: always()
        run: |
          {
            echo "### Deployed \`${GITHUB_SHA:0:7}\`"
            echo
            echo '```'
            kubectl -n "$NAMESPACE" get deploy,pods -o wide 2>&1 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # ===========================================================================
  # 8. SLACK — one message per run
  # ===========================================================================
  #
  # A single terminal job rather than a notification step bolted onto all seven
  # others. That buys two things: exactly ONE message per run instead of a burst
  # of seven, and access to `needs.*.result`, so the alert can name WHICH stage
  # broke instead of only reporting that something did.
  notify:
    name: Slack notification
    runs-on: ubuntu-latest
    needs: [lint, test-backend, test-frontend, scan-source, build-scan, push, deploy]

    # Deliberately quiet. It fires when something failed, or on any main-branch
    # push so a production deploy is always confirmed either way. A green PR
    # sends nothing — a channel that pings on every success gets muted, and a
    # muted channel is the same as no alerting at all.
    #
    # always() is load-bearing: without it this job is skipped the moment a
    # dependency fails, which is precisely the case it exists to report.
    if: >-
      always() && (
        contains(needs.*.result, 'failure') ||
        (github.event_name == 'push' && github.ref == 'refs/heads/main')
      )

    steps:
      - name: Post to Slack
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

          # UNTRUSTED INPUT. A commit subject is attacker-controlled on a fork
          # PR and can contain backticks, quotes and $(...). Interpolating
          # ${{ ... }} straight into a run block pastes it into the script
          # BEFORE bash sees it, which is remote code execution on the runner.
          # Passing it through the environment and then `jq --arg` means bash
          # never parses it and jq does the JSON escaping.
          COMMIT_MSG: ${{ github.event.head_commit.message || github.event.pull_request.title }}

          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          COMMIT_URL: ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}

          R_LINT: ${{ needs.lint.result }}
          R_TEST_BACKEND: ${{ needs.test-backend.result }}
          R_TEST_FRONTEND: ${{ needs.test-frontend.result }}
          R_SCAN_SOURCE: ${{ needs.scan-source.result }}
          R_BUILD_SCAN: ${{ needs.build-scan.result }}
          R_PUSH: ${{ needs.push.result }}
          R_DEPLOY: ${{ needs.deploy.result }}
        run: |
          # No `set -e`: a notification must never be the thing that fails a
          # build. Every failure path below is handled explicitly instead.
          set -uo pipefail

          # Fork PRs are not given secrets, and the webhook may not be
          # configured yet. Neither is an error — say so and leave green.
          if [ -z "${SLACK_WEBHOOK_URL:-}" ]; then
            echo "::notice::SLACK_WEBHOOK_URL is not set — skipping the Slack notification."
            exit 0
          fi

          # --- Which stages failed? ---------------------------------------------
          # 'skipped' is not a failure: `push` and `deploy` are skipped by design
          # on every pull request.
          failed=""
          check() {
            if [ "$2" = "failure" ]; then
              failed="${failed:+$failed, }$1"
            fi
          }
          check "Static analysis"        "$R_LINT"
          check "Backend tests"          "$R_TEST_BACKEND"
          check "Frontend tests"         "$R_TEST_FRONTEND"
          check "Trivy (source + IaC)"   "$R_SCAN_SOURCE"
          check "Build & scan images"    "$R_BUILD_SCAN"
          check "Push to ECR + GHCR"     "$R_PUSH"
          check "Deploy to EKS"          "$R_DEPLOY"

          if [ -n "$failed" ]; then
            header=":x: *CI/CD failed*"
            color="#d10c20"
          else
            header=":white_check_mark: *CI/CD passed*"
            color="#2eb886"
          fi

          # First line only, capped at 120 chars, with & < > escaped the way
          # Slack specifies. Escaping rather than deleting means a crafted
          # subject cannot forge a <url|link> in the message, while a legitimate
          # `a > b` still renders as written.
          subject="$(printf '%s' "$COMMIT_MSG" \
            | head -n 1 \
            | cut -c1-120 \
            | sed -e 's/&/\&amp;/g' -e 's/</\&lt;/g' -e 's/>/\&gt;/g')"

          body="*Repo:* ${GITHUB_REPOSITORY}
          *Branch:* \`${GITHUB_REF_NAME}\`   *Event:* \`${GITHUB_EVENT_NAME}\`
          *Commit:* <${COMMIT_URL}|\`${GITHUB_SHA:0:7}\`> by \`${GITHUB_ACTOR}\`
          *Subject:* ${subject}"

          case "$R_DEPLOY" in
            success)
              body="${body}
          :rocket: Rolled out to EKS — cluster \`${CLUSTER_NAME}\`, namespace \`${NAMESPACE}\`."
              ;;
            failure)
              body="${body}
          :rotating_light: Rollout FAILED — both deployments were rolled back."
              ;;
          esac

          if [ -n "$failed" ]; then
            body="${body}
          *Failed stages:* ${failed}"
          fi

          # jq -n --arg builds the JSON; no shell string ever becomes JSON
          # syntax by hand. `attachments[].color` is what draws the red or
          # green bar down the left of the message.
          payload="$(jq -n \
            --arg color "$color" \
            --arg header "$header" \
            --arg body "$body" \
            --arg run_url "$RUN_URL" \
            --arg run_label "View run #${GITHUB_RUN_NUMBER}" \
            '{
              attachments: [{
                color: $color,
                blocks: [
                  { type: "section", text: { type: "mrkdwn", text: $header } },
                  { type: "section", text: { type: "mrkdwn", text: $body } },
                  { type: "actions", elements: [
                      { type: "button",
                        text: { type: "plain_text", text: $run_label },
                        url: $run_url }
                  ] }
                ]
              }]
            }')"

          # Slack being unreachable must not turn a good deploy red.
          if ! curl -sS --fail --max-time 20 \
                 -X POST -H 'Content-type: application/json' \
                 --data "$payload" "$SLACK_WEBHOOK_URL" >/dev/null; then
            echo "::warning::Slack notification could not be delivered. The pipeline result itself is unaffected."
          fi
